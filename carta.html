// =====================================================================

// distância (em casas) de cada casa até a casa mais perto do outro tipo: duas passadas (chanfro)

// ---------- relevo: Andes a partir da costa do Pacífico, serras do Brasil, planaltos

// bioma pela posição (lon, lat), altura e distância da costa

  if (incl > 1.2 || h > 70) return '#8f887c';                                        // rocha
  if (h < 1.6 && s < 12) return lat < -40 ? '#c9bb8a' : '#ead9a4';                   // praia (só na beira d'água)
  if (lon > -72.5 && lon < -68.5 && lat > -27 && lat < -17) return '#dcc38e';         // Atacama
  if (lat > -18 && lat < -4 && lon < -70 && s < 140 && h < 45) return '#d6bd88';      // deserto da costa do Peru
  if (lat > -18 && lat < -15 && lon > -58 && lon < -55) return '#7f9a52';             // Pantanal
  if (lat < -40 && lon > -71.5) return '#b9a873';                                    // estepe da Patagônia
  if (lat > -39 && lat < -28 && lon > -65 && lon < -52) return '#a9c46a';             // Pampa
  if (lat > -16 && lat < -3 && lon > -45 && lon < -35 && s > 60) return '#c4b06e';    // Caatinga
  if (lat > -21 && lat < -12 && lon < -45 && lon > -65 && lat > -12 - 99) { if (lon > -60) return '#a8b35e'; }  // Cerrado
  if (lat > 2 && lat < 9 && lon > -73 && lon < -62) return '#a3b45a';                 // Llanos
  if (lat > -15 && lat < 6 && lon > -78 && lon < -45) return '#2f7a3c';               // Amazônia

// =====================================================================
// CENA
// =====================================================================
const tela = document.getElementById('tela');
const renderer = new THREE.WebGLRenderer({ canvas: tela, antialias: true, preserveDrawingBuffer: /[?&]gravar/.test(location.search), powerPreference: 'high-performance' });

const camera = new THREE.PerspectiveCamera(50, 1, 2, 9000);
const SOL = new THREE.Vector3(0.45, 0.8, 0.35).normalize();
const sol = new THREE.DirectionalLight('#fff4dd', 2.6); sol.position.copy(SOL).multiplyScalar(100); cena.add(sol);

// ---------- terreno low-poly (uma cor por triângulo), uma casa sim, outra não
{
  const P = 2, pos = [], cor = [], c = new THREE.Color();

}
// ---------- florestas: copas instanciadas onde o bioma é mata
{
  const N = 7000, copas = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(9, 0), new THREE.MeshLambertMaterial({ flatShading: true }), N), o = new THREE.Object3D(), c = new THREE.Color();

}

// ---------- mar: ondas facetadas, cor pela distância da costa
const texProf = (() => {

  for (const [peer, bruto] of lista()) {
    const e = limpar(bruto); if (e.cena !== 'carta') continue; vistos.add(peer);
    let o = OUTROS.get(peer); if (!o) { o = { g: criarBarco('#d8c9a0'), x: e.x, z: e.z, rumo: e.rumo, rot: rotulo('', 'navio') }; OUTROS.set(peer, o); }
    o.x += (e.x - o.x) * Math.min(1, dt * 4); o.z += (e.z - o.z) * Math.min(1, dt * 4); o.rumo += Math.atan2(Math.sin(e.rumo - o.rumo), Math.cos(e.rumo - o.rumo)) * Math.min(1, dt * 4);
    pousar(o.g, o.x, o.z, o.rumo, t); o.g.vela.visible = e.velas > 0; o.rot.textContent = e.nome; fixar(o.rot, o.x, 16, o.z, 2500);
  }
  for (const [peer, o] of OUTROS) if (!vistos.has(peer)) { cena.remove(o.g); o.rot.remove(); OUTROS.delete(peer); }
  const n = quantos(); elOnline.style.display = 'block';
  elOnline.textContent = n > 1 ? `online · ${n} piratas (${OUTROS.size} no mar aberto)` : 'online · só você por enquanto';
}

// ---------- toque
const TQ = criarControles({
  esquerda: [{ nome: 'bombordo', rotulo: '◀', legenda: 'leme', key: 'a', classe: 'grande' }, { nome: 'boreste', rotulo: '▶', legenda: 'leme', key: 'd', classe: 'grande' }],
  acoes: [{ nome: 'sobe', rotulo: '▲', legenda: 'vela', key: 'w' }, { nome: 'desce', rotulo: '▼', legenda: 'vela', key: 's' }, { nome: 'entrar', rotulo: 'E', legenda: 'entrar', key: 'e', classe: 'grande' }],
  topo: [{ nome: 'carta', rotulo: '✦', legenda: 'carta', key: 'm' }, { nome: 'perto', rotulo: '+', legenda: 'zoom', f: () => (cam.dist = Math.max(70, cam.dist * 0.8)) },
    { nome: 'longe', rotulo: '−', legenda: 'zoom', f: () => (cam.dist = Math.min(2200, cam.dist * 1.25)) }, { nome: 'cheia', rotulo: '⛶', legenda: 'tela', f: telaCheia }],
});
if (TQ.ativo) elAjuda.innerHTML = '<b>◀ ▶</b> leme · <b>▲ ▼</b> vela · <b>✦</b> carta grande · <b>E</b> perto de um porto: entrar · <b>arraste</b> para girar a câmera';

// =====================================================================
// LAÇO
// =====================================================================
const relogio = new THREE.Clock();
let t = 0, chegada = 1;
const ROSA = ['N', 'NO', 'O', 'SO', 'S', 'SE', 'L', 'NE'];
function quadro() {
  requestAnimationFrame(quadro);
  const dt = Math.min(relogio.getDelta(), 0.05);
  if (document.hidden) return;
  t += dt;
  // navegação
  const querLeme = (teclas.has('a') || teclas.has('arrowleft') ? 1 : 0) - (teclas.has('d') || teclas.has('arrowright') ? 1 : 0);
  estado.leme += (querLeme - estado.leme) * Math.min(1, dt * 3);
  estado.vel += (estado.velas * VEL_MAX - estado.vel) * Math.min(1, dt * 0.45);
  estado.rumo = Math.atan2(Math.sin(estado.rumo + estado.leme * 0.45 * (0.25 + 0.75 * estado.vel / VEL_MAX) * dt), Math.cos(estado.rumo + estado.leme * 0.45 * (0.25 + 0.75 * estado.vel / VEL_MAX) * dt));
  const nx = estado.x + Math.cos(estado.rumo) * estado.vel * dt, nz = estado.z - Math.sin(estado.rumo) * estado.vel * dt;
  const proaX = nx + Math.cos(estado.rumo) * 8, proaZ = nz - Math.sin(estado.rumo) * 8;
  if (Math.max(amostra(S, nx, nz), amostra(S, proaX, proaZ)) > -3) { if (estado.vel > 2) avisar('Terra à vista: a jangada encalhou.', t); estado.vel *= -0.3; }
  else if (nx > MX0 + 20 && nx < MX1 - 20 && nz > MZ0 + 20 && nz < MZ1 - 20) { estado.x = nx; estado.z = nz; }
  else { estado.vel = 0; avisar('Além daqui, a carta não mostra nada.', t); }
  pousar(barco, estado.x, estado.z, estado.rumo, t); barco.vela.visible = estado.velas > 0;
  mar.position.set(Math.round(estado.x / 12) * 12, 0, Math.round(estado.z / 12) * 12);
  matMar.uniforms.uT.value = t; matMar.uniforms.uCentro.value.set(estado.x, 0, estado.z);
  // câmera atrás do barco, girando devagar com o rumo
  cam.segue += Math.atan2(Math.sin(estado.rumo - cam.segue), Math.cos(estado.rumo - cam.segue)) * Math.min(1, dt * 0.8);
  const ang = cam.segue + Math.PI + cam.giro;
  camera.position.set(estado.x + Math.cos(ang) * cam.dist * Math.cos(cam.alt), cam.dist * Math.sin(cam.alt) + 8, estado.z - Math.sin(ang) * cam.dist * Math.cos(cam.alt));
  camera.lookAt(estado.x, 6, estado.z);
  // portos e regiões
  portoPerto = null;
  for (const p of PORTOS) { fixar(p.rot, p.x, Math.max(0, amostra(A, p.x, p.z)) + 46, p.z, 3200); if (Math.hypot(p.x - estado.x, p.z - estado.z) < 70) portoPerto = p; }
  const dica = portoPerto ? (portoPerto.aberto ? `<b>E</b> entrar em ${portoPerto.nome}` : `${portoPerto.nome}: em breve`) : '';
  if (elDica.innerHTML !== dica) { elDica.innerHTML = dica; elDica.style.display = dica ? 'block' : 'none'; }
  TQ.apagar('entrar', !portoPerto?.aberto);
  const r = ondeEstou(estado.x, estado.z);
  if (elNome.textContent !== r.nome) { elNome.textContent = r.nome; elDesc.innerHTML = `<span class="dif">${'★'.repeat(r.faixa)}${'☆'.repeat(Math.max(0, 6 - r.faixa))}</span> ${r.desc}`; }
  elNos.textContent = Math.round(Math.abs(estado.vel) * 1.6); elVela.classList.toggle('on', estado.velas > 0);
  elAgulha.style.transform = `rotate(${(-estado.rumo + Math.PI / 2) * 180 / Math.PI}deg)`;
  if (t > avisoAte) elAviso.style.opacity = 0;
  if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) desenharMini();
  if (t - salvoEm > 5) salvar();
  if (temRede) { const eu = salvo.jogador(); enviar({ cena: 'carta', nome: eu?.nome || 'Náufrago', comp: eu?.aparencia?.personagem || {}, x: estado.x, z: estado.z, rumo: estado.rumo, velas: estado.velas }); atualizarOutros(dt, t); }
  // véu: abre ao chegar, fecha ao entrar num porto
  if (chegada > 0) { chegada = Math.max(0, chegada - dt / 1.2); elVeu.style.opacity = chegada; }
  if (saindo) { saindo += dt; elVeu.style.opacity = Math.min(1, saindo / 1.1); cam.dist = Math.max(70, cam.dist * (1 - dt)); if (saindo > 1.2 && saindo < 10) { saindo = 99; location.href = 'mar.html'; } }
  renderer.render(cena, camera);
}
document.getElementById('carregando').remove();
desenharMini();
avisar(ondeEstou(estado.x, estado.z).nome, 0);
quadro();
window.__carta = { estado, PORTOS, REGIOES, amostra, S, A, deLonLat, paraLonLat, cam };   // para testes no console
</script>
</body>
</html>
