<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/loaders/GLTFLoader.js';

import { criarFabrica, QUADRO, DIRECOES, OFF as OFF_ISO } from './js/fabrica.js';
import { temRede, enviar, lista, quantos, limpar } from './js/rede.js';
import { criarControles, telaCheia } from './js/toque.js';
import { sincronizarSempre } from './js/nuvem.js';
import { criarVeu, hora, escuro, textoHora } from './js/noite.js';
import { criarAvisos } from './js/avisos.js';
const avisos = criarAvisos();

// =====================================================================
// 1. MAPA: a Baía de Guanabara desenhada por polígonos
// Coordenadas no papel: (x = leste, n = norte), em metros de jogo. No 3D, z = -n.
// A baía real tem ~28 km; aqui 1 km vira ~80 m, e a barra foi alargada para jogar bem.
// =====================================================================
const P = (pts) => pts.map(([x, n]) => [x, -n]);

// Contorno da ÁGUA (oceano + barra + baía). Tudo fora dele é continente.
const AGUA = P([
  [-2600, -3000], [2600, -3000], [2600, -1000],
  [900, -1010], [500, -1040], [250, -1000],          // praias oceânicas de Niterói
  [130, -940], [120, -850],                           // ponta de Santa Cruz (lado leste da barra)
  [220, -780], [330, -760], [300, -690],              // enseada de Jurujuba
  [260, -640], [330, -560], [300, -480],              // Icaraí e Boa Viagem
  [260, -400], [290, -300], [240, -220],              // centro de Niterói e Ponta da Areia
  [330, -150], [420, -50], [520, 100], [640, 250], [760, 420],   // São Gonçalo
  [900, 600], [950, 800], [850, 1000],                // manguezal de Guapimirim
  [600, 1150], [300, 1220], [0, 1250], [-300, 1200],  // fundo da baía (Magé)
  [-600, 1100], [-800, 950], [-900, 750], [-880, 550], [-800, 400],
  [-720, 250], [-600, 120], [-480, 0], [-400, -120],  // porto do Rio
  [-330, -250], [-300, -350], [-330, -450], [-300, -560],        // centro, Glória, Flamengo
  [-330, -650], [-400, -700], [-360, -760],           // enseada de Botafogo
  [-200, -800], [-110, -860], [-100, -940],           // Urca e Pão de Açúcar (lado oeste da barra)
  [-200, -1000], [-450, -1050], [-800, -1030], [-2600, -1060],   // Copacabana e além
]);
const ILHAS = [
  P([[-640, 330], [-560, 470], [-420, 540], [-280, 500], [-230, 400], [-300, 300], [-430, 270], [-540, 250]]), // Governador
  P([[380, 720], [430, 790], [480, 800], [470, 730], [420, 690]]),                 // Paquetá
  P([[-250, -230], [-215, -200], [-190, -235], [-225, -265]]),                     // Ilha das Cobras
  P([[-240, -430], [-215, -400], [-195, -430], [-220, -455]]),                     // Villegagnon
  P([[215, -500], [235, -480], [255, -500], [235, -520]]),                         // Boa Viagem
  P([[110, -200], [150, -140], [180, -200], [145, -260]]),                         // Mocanguê
  P([[-540, -1340], [-500, -1310], [-460, -1345], [-490, -1385], [-530, -1375]]),  // Cagarras
  P([[-130, -1470], [-95, -1450], [-65, -1485], [-100, -1510]]),                   // Ilha Rasa
  P([[670, -1170], [705, -1150], [735, -1185], [700, -1212]]),                     // Ilha do Pai
];
// Morros: [x, n, altura, raio, quanto da orla fica plano]
const PICOS = [
  [-150, -870, 95, 42, 20],     // Pão de Açúcar
  [-520, -620, 120, 110, 70],   // Corcovado
  [-850, -380, 150, 260, 90],   // Maciço da Tijuca
  [-1200, -800, 90, 300, 90],
  [520, -720, 60, 130, 60], [700, -420, 55, 180, 80], [900, -900, 70, 220, 60],   // morros de Niterói
  [0, 1560, 240, 330, 120], [-560, 1500, 210, 330, 120], [620, 1520, 220, 330, 120],   // Serra dos Órgãos
  [1200, 1300, 160, 350, 120], [-1200, 1200, 150, 350, 120],
  [-430, 400, 22, 120, 40],     // Ilha do Governador
  [-500, -1350, 34, 38, 12], [-100, -1480, 22, 35, 12], [700, -1180, 26, 35, 12],  // ilhas do mar aberto
];
// Lugares com nome: [nome, x, n, raio em que o nome aparece no painel, descrição]
const LUGARES = [
  ['Niterói', 330, -350, 200, 'seu porto de origem'],
  ['Rio de Janeiro', -430, -280, 230, 'a cidade rival, do outro lado da baía'],
  ['Fortaleza de Santa Cruz', 170, -890, 150, 'forte da Armada: guarda a barra'],
  ['Pão de Açúcar', -150, -870, 120, 'o marco da entrada da baía'],
  ['Ilha do Governador', -430, 400, 260, 'a maior ilha da baía'],
  ['Paquetá', 430, 745, 170, 'ilhota sossegada, boa para se esconder'],
  ['Manguezal de Guapimirim', 800, 760, 260, 'raízes, lama e pouca visão'],
  ['Icaraí', 300, -600, 110, 'praia de Niterói'],
  ['Jurujuba', 280, -740, 90, 'enseada de pescadores'],
  ['Botafogo', -370, -700, 110, 'enseada abrigada'],
  ['São Gonçalo', 560, 120, 200, 'margem leste da baía'],
  ['Magé', 0, 1290, 260, 'fundo da baía, aos pés da serra'],
  ['Ilhas Cagarras', -500, -1350, 200, 'rochedos no mar aberto'],
  ['Ilha Rasa', -100, -1480, 170, 'a última terra antes do alto-mar'],
];

// ---------- geometria 2D
function distSeg(px, pz, a, b) {
  const vx = b[0] - a[0], vz = b[1] - a[1];
  let t = ((px - a[0]) * vx + (pz - a[1]) * vz) / (vx * vx + vz * vz);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - a[0] - vx * t, pz - a[1] - vz * t);
}
// distância com sinal até a borda do polígono: + dentro, - fora
function assinada(poly, px, pz) {
  let dentro = false, d = Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > pz) !== (b[1] > pz) && px < (b[0] - a[0]) * (pz - a[1]) / (b[1] - a[1]) + a[0]) dentro = !dentro;
    d = Math.min(d, distSeg(px, pz, a, b));
  }
  return dentro ? d : -d;
}
// "s": metros até a linha da costa. Positivo em terra, negativo na água.
function costa(px, pz) {
  let s = -assinada(AGUA, px, pz);
  for (const ilha of ILHAS) s = Math.max(s, assinada(ilha, px, pz));
  return s;
}
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function alturaDe(x, z, s) {
  if (s <= 0) return Math.max(s * 0.18, -9);
  let h = Math.min(s * 0.12, 5);
  const ondulado = 7 + 5 * Math.sin(x * 0.013 + 1) * Math.cos(z * 0.017) + 4 * Math.sin(x * 0.031 + z * 0.027);
  h += ondulado * sm(8, 90, s);
  for (const [px, pn, ph, pr, borda] of PICOS) {
    const dx = x - px, dz = z + pn;
    h += ph * Math.exp(-(dx * dx + dz * dz) / (pr * pr)) * sm(3, borda, s);
  }
  return h;
}

// ---------- grade do mundo (calculada uma vez ao abrir)
const X0 = -1700, Z0 = -1800, LARG = 3400, COMP = 3700, NX = 212, NZ = 231;
const CX = LARG / NX, CZ = COMP / NZ;
const S = new Float32Array((NX + 1) * (NZ + 1)), A = new Float32Array((NX + 1) * (NZ + 1));
for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) {
  const x = X0 + i * CX, z = Z0 + j * CZ, s = costa(x, z);
  S[j * (NX + 1) + i] = s; A[j * (NX + 1) + i] = alturaDe(x, z, s);
}
function amostra(grade, x, z) {
  const fx = Math.max(0, Math.min(NX - 1e-4, (x - X0) / CX)), fz = Math.max(0, Math.min(NZ - 1e-4, (z - Z0) / CZ));
  const i = Math.floor(fx), j = Math.floor(fz), a = fx - i, b = fz - j, k = j * (NX + 1) + i;
  return (grade[k] * (1 - a) + grade[k + 1] * a) * (1 - b) + (grade[k + NX + 1] * (1 - a) + grade[k + NX + 2] * a) * b;
}
let semente = 20261116;
const rnd = () => { semente |= 0; semente = semente + 0x6D2B79F5 | 0; let t = Math.imul(semente ^ semente >>> 15, 1 | semente); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// =====================================================================
// 2. CENA
// =====================================================================
const tela = document.getElementById('tela');
const renderer = new THREE.WebGLRenderer({ canvas: tela, antialias: true, preserveDrawingBuffer: /[?&]gravar/.test(location.search), powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const cena = new THREE.Scene();
const CEU = new THREE.Color('#bfe3f2');
cena.background = CEU;
cena.fog = new THREE.Fog(CEU, 500, 3000);
const camera = new THREE.PerspectiveCamera(50, 1, 1, 7000);
const SOL = new THREE.Vector3(0.45, 0.8, 0.35).normalize();
const sol = new THREE.DirectionalLight('#fff4dd', 2.6); sol.position.copy(SOL).multiplyScalar(100); cena.add(sol);
const ceu = new THREE.HemisphereLight('#dff3ff', '#8a7f5a', 1.5); cena.add(ceu);
// noite e dia (js/noite.js): o mesmo relógio da terra; à noite só a lanterna do barco ilumina em volta
const veu = criarVeu(1); tela.after(veu.elemento);
const elHoraMar = document.createElement('div'); elHoraMar.style.cssText = 'position:fixed;left:24px;bottom:112px;z-index:4;font:13px Georgia,serif;color:#fff3d6;text-shadow:0 1px 3px #000;pointer-events:none'; document.body.appendChild(elHoraMar);
const v3noite = new THREE.Vector3();

// ---------- terreno low-poly: uma cor por triângulo
{
  const pos = [], cor = [], c = new THREE.Color();
  const AREIA = new THREE.Color('#ead9a4'), RELVA = new THREE.Color('#a9bf6a'), MATA = new THREE.Color('#4f9a4a'), MATA2 = new THREE.Color('#3c8244'),
        ROCHA = new THREE.Color('#8f887c'), MANGUE = new THREE.Color('#5f7a3c'), LAMA = new THREE.Color('#9a8c66');
  const tri = (p, q, r) => {
    const h = (p[1] + q[1] + r[1]) / 3, incl = (Math.max(p[1], q[1], r[1]) - Math.min(p[1], q[1], r[1])) / CX;
    const x = (p[0] + q[0] + r[0]) / 3, z = (p[2] + q[2] + r[2]) / 3, mangue = x > 560 && z < -350;
    if (incl > 0.95 || h > 150) c.copy(ROCHA);
    else if (h < 1.3) c.copy(mangue ? LAMA : AREIA);
    else if (h < 3.2) c.copy(mangue ? MANGUE : RELVA);
    else c.copy(mangue ? MANGUE : (rnd() < 0.5 ? MATA : MATA2));
    c.offsetHSL(0, 0, (rnd() - 0.5) * 0.05);
    for (const v of [p, q, r]) { pos.push(v[0], v[1], v[2]); cor.push(c.r, c.g, c.b); }
  };
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const k = j * (NX + 1) + i, x = X0 + i * CX, z = Z0 + j * CZ;
    const a = [x, A[k], z], b = [x + CX, A[k + 1], z], d = [x, A[k + NX + 1], z + CZ], e = [x + CX, A[k + NX + 2], z + CZ];
    if (Math.max(a[1], b[1], d[1], e[1]) < -2.5) continue;   // fundo do mar: a água cobre
    tri(a, d, b); tri(b, d, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cor, 3));
  cena.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
}

// ---------- mar: ondas facetadas, cor pela profundidade, espuma na orla
const ampDe = (z) => 0.35 + 1.6 * sm(850, 1100, z);                      // baía calma, mar aberto bravo
// a mesma fórmula está no shader do mar, logo abaixo: mudou aqui, mude lá
const formaOnda = (x, z, t) => Math.sin(x * 0.05 + t * 1.1) * 0.5 + Math.sin(z * 0.08 + t * 0.9 + 1.3) * 0.3 + Math.sin((x + z) * 0.03 + t * 0.6) * 0.5
  + Math.sin(x * 0.21 + z * 0.13 + t * 1.7) * 0.2 + Math.sin(z * 0.27 - x * 0.11 + t * 1.3) * 0.16;
const alturaOnda = (x, z, t) => formaOnda(x, z, t) * ampDe(z) * (1 - sm(-30, -2, amostra(S, x, z)));
const texProf = (() => {
  const d = new Uint8Array((NX + 1) * (NZ + 1) * 4);
  for (let k = 0; k < S.length; k++) { d[k * 4] = Math.max(0, Math.min(255, (S[k] + 64) / 128 * 255)); d[k * 4 + 3] = 255; }
  const t = new THREE.DataTexture(d, NX + 1, NZ + 1, THREE.RGBAFormat);
  t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
})();
const matMar = new THREE.ShaderMaterial({
  uniforms: {
    uT: { value: 0 }, uCentro: { value: new THREE.Vector3() }, uProf: { value: texProf },
    uMapa: { value: new THREE.Vector4(X0, Z0, LARG, COMP) }, uTex: { value: new THREE.Vector2(NX + 1, NZ + 1) },
    uFundo: { value: new THREE.Color('#1c7fa6') }, uRaso: { value: new THREE.Color('#4fd0cf') }, uEspuma: { value: new THREE.Color('#f4fbff') },
    uNevoa: { value: CEU }, uSol: { value: SOL },
  },
  vertexShader: /* glsl */`
    uniform float uT; uniform vec3 uCentro; uniform sampler2D uProf; uniform vec4 uMapa; uniform vec2 uTex;
    varying vec3 vW; varying float vS;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.0);
      vec2 uv = (w.xz - uMapa.xy) / uMapa.zw; uv = uv * (uTex - 1.0) / uTex + 0.5 / uTex;
      float s = texture2D(uProf, uv).r * 128.0 - 64.0;

    if (Math.abs(estado.vel) > 1.5) avisar('A jangada encalhou na areia.', t);

  } else if (Math.abs(nx) > 1500 || nz > 1700) {

  const [nome, desc] = ondeEstou(); if (elNome.textContent !== nome) { elNome.textContent = nome; elDesc.textContent = desc; }
  elNos.textContent = Math.round(Math.abs(estado.vel) * 0.8);

  if (chegada > 0) { chegada = Math.max(0, chegada - dt / 1.6); elVeu.style.opacity = Math.min(1, chegada * 1.4); }

  }

    const eu = salvo.jogador();
    enviar({ cena: 'mar', nome: eu?.nome || 'Náufrago', comp: eu?.aparencia?.personagem || {}, x: estado.x, z: estado.z, rumo: estado.rumo, velas: estado.velas });

}

}
